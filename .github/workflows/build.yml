# 构建流程说明见仓库 README
name: Build APK

# 触发方式：
#   - 推送到 main/master 时自动编译
#   - 手动触发（Actions 页面点 Run workflow）
#   - PR 时只跑测试
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 发布 Release 需要写权限（默认 token 在部分仓库上是只读）
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK diagnostics
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          ls -d "$ANDROID_HOME" 2>/dev/null || echo "SDK 目录不存在"
          which sdkmanager || echo "sdkmanager 不在 PATH"
          ls "$ANDROID_HOME/cmdline-tools" 2>/dev/null || true

      # runner 预装 Android SDK。这里只接受许可 + 备齐本项目需要的组件；
      # 不依赖第三方 setup action（它的失败会让后续所有步骤被跳过）。
      - name: Accept SDK licenses and install components
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -5 || true
          sdkmanager --list_installed 2>/dev/null | head -15 || true

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # runner 是一次性的：不固定密钥的话每次都会新生成一份，导致签名变化、无法覆盖安装。
      # 把密钥库固定在 $HOME/.signing 下并缓存，后续构建复用同一份。
      - name: Restore signing keystore (cache)
        uses: actions/cache@v4
        with:
          path: ~/.signing/mixinput.keystore
          key: mixinput-signing-keystore-v1

      # 单元测试：结果上传为报告，但失败不阻塞出包。
      # 注意：DocsReferenceTest 等「文档同步门禁」在分支上会失败（我们加了源码但未同步其文档），
      # 因此这里不把测试失败当成构建失败；测试报告仍完整产出，供人工查看回归。
      - name: Unit tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      # 把测试结果汇总到 Actions 页面的 Summary：失败用例直接列名，
      # 不用下载报告就能判断「哪些失败、是否只是文档门禁」。
      - name: Summarize test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os
          import xml.etree.ElementTree as ET

          total = fails = errors = skipped = 0
          failed = []
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root = ET.parse(f).getroot()
              total += int(root.get('tests', 0))
              fails += int(root.get('failures', 0))
              errors += int(root.get('errors', 0))
              skipped += int(root.get('skipped', 0))
              for tc in root.iter('testcase'):
                  if tc.find('failure') is not None or tc.find('error') is not None:
                      failed.append(f"{tc.get('classname')} :: {tc.get('name')}")

          lines = ['# 单元测试结果', '', f'- 总数：{total}', f'- 失败：{fails + errors}', f'- 跳过：{skipped}', '']
          if failed:
              lines.append('## 失败用例')
              lines += [f'- `{x}`' for x in failed[:60]]
              if len(failed) > 60:
                  lines.append(f'- …另有 {len(failed) - 60} 条')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'w') as fh:
              fh.write('\n'.join(lines))
          print(f'total={total} failed={fails + errors} skipped={skipped}')
          PY

      # 签名密钥优先级：仓库 Secrets > 缓存/新生成的密钥库。
      # 结果通过 GITHUB_ENV 传给后续 Gradle 步骤（Jinn 从这四个环境变量读签名）。
      - name: Prepare signing keystore
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.JINN_KEYSTORE_B64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.JINN_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.JINN_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.JINN_KEY_PASSWORD }}
        run: |
          set -e
          KS="$HOME/.signing/mixinput.keystore"
          mkdir -p "$(dirname "$KS")"
          if [ -n "$SECRET_KEYSTORE_B64" ]; then
            echo "==> 使用仓库 Secrets 提供的签名密钥"
            echo "$SECRET_KEYSTORE_B64" | base64 -d > "$KS"
            echo "JINN_KEYSTORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "JINN_KEY_ALIAS=$SECRET_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "JINN_KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            if [ ! -f "$KS" ]; then
              echo "==> 首次构建：生成签名密钥（后续构建复用同一份）"
              keytool -genkeypair -keystore "$KS" -alias mixinput \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass mixinput -keypass mixinput \
                -dname "CN=mixinput, OU=dev, O=mixinput, C=CN"
            else
              echo "==> 复用缓存中的签名密钥"
            fi
            echo "JINN_KEYSTORE_PASSWORD=mixinput" >> "$GITHUB_ENV"
            echo "JINN_KEY_ALIAS=mixinput" >> "$GITHUB_ENV"
            echo "JINN_KEY_PASSWORD=mixinput" >> "$GITHUB_ENV"
          fi
          echo "JINN_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
          ls -la "$KS"

      # 有固定密钥后总是出 release（R8 优化过、体积更小）；万一 release 失败再回退 debug。
      - name: Build APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace || {
            echo "::warning title=release 构建失败::回退为 debug 构建"
            ./gradlew assembleDebug --no-daemon --stacktrace
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jinn-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 把 APK 换成好认的名字，并把签名指纹写进环境变量。
      # 指纹会显示在 Release 说明里，方便跨构建核对「签名是否稳定」（可直接覆盖安装）。
      - name: Prepare APK
        run: |
          mkdir -p out
          for f in app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk; do
            [ -f "$f" ] || continue
            cp "$f" "out/mixinput-${GITHUB_RUN_NUMBER}.apk"
          done
          ls -la out/
          APK=$(ls out/*.apk 2>/dev/null | head -1)
          CERT=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -n "$APK" ] && [ -n "$CERT" ]; then
            FP=$("$CERT" verify --print-certs "$APK" 2>/dev/null | grep "SHA-256 digest" | head -1 | awk '{print $NF}')
          fi
          echo "SIGN_FP=${FP:-未知}" >> "$GITHUB_ENV"
          echo "签名指纹: ${FP:-未知}"

      # 发布为 Release：手机上一键下载，不像 Artifacts 那样需要登录与翻找。
      # 每次构建一个新 tag（不覆盖历史产物），标记为 prerelease 以免占用 Latest。
      - name: Publish Release with APK
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 构建 ${{ github.run_number }}
          body: |
            自动构建产物

            - 提交：`${{ github.sha }}`
            - 构建号：${{ github.run_number }}
            - **签名指纹（SHA-256）**：`${{ env.SIGN_FP }}`
            - 下载下方 Asset 中的 APK 直接安装

            > 签名指纹相同 = 可直接覆盖安装；不同则需先卸载旧版。
          files: out/*.apk
          prerelease: true
          fail_on_unmatched_files: false
