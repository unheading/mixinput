name: Build APK

# 触发方式：
#   - 推送到 main/master 时自动编译
#   - 手动触发（Actions 页面点 Run workflow）
#   - PR 时只跑测试
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 发布 Release 需要写权限（默认 token 在部分仓库上是只读）
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK diagnostics
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          ls -d "$ANDROID_HOME" 2>/dev/null || echo "SDK 目录不存在"
          which sdkmanager || echo "sdkmanager 不在 PATH"
          ls "$ANDROID_HOME/cmdline-tools" 2>/dev/null || true

      # runner 预装 Android SDK。这里只接受许可 + 备齐本项目需要的组件；
      # 不依赖第三方 setup action（它的失败会让后续所有步骤被跳过）。
      - name: Accept SDK licenses and install components
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -5 || true
          sdkmanager --list_installed 2>/dev/null | head -15 || true

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # runner 是一次性的：每次跑都会新生成一个 debug 密钥，导致每次产物的签名都不同、
      # 无法覆盖安装（必须卸载重装、丢数据）。把 debug 密钥缓存起来，让后续运行复用同一份，
      # 签名就稳定了。（配了 release 签名 Secrets 时以 Secrets 为准）
      - name: Restore stable debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      # 单元测试：结果上传为报告，但失败不阻塞出包。
      # 注意：DocsReferenceTest 等「文档同步门禁」在分支上会失败（我们加了源码但未同步其文档），
      # 因此这里不把测试失败当成构建失败；测试报告仍完整产出，供人工查看回归。
      - name: Unit tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      # 有签名密钥就出 release（可覆盖安装、可发布），没有就退化为 debug（可直接安装验证）。
      # 密钥通过仓库 Secrets 提供，避免把签名材料写进代码库。
      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.JINN_KEYSTORE_B64 }}
          KS_PASSWORD: ${{ secrets.JINN_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.JINN_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.JINN_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_B64" ]; then
            echo "使用 Secrets 中的签名密钥构建 release"
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export JINN_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
            export JINN_KEYSTORE_PASSWORD="$KS_PASSWORD"
            export JINN_KEY_ALIAS="$KS_ALIAS"
            export JINN_KEY_PASSWORD="$KS_KEY_PASSWORD"
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            echo "::warning title=未配置签名密钥::未设置 JINN_KEYSTORE_B64，本次构建 debug APK（debug 签名，可与 release 共存需先卸载）"
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jinn-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 把 APK 换成好认的名字，方便作为 Release 附件发布
      - name: Prepare APK
        run: |
          mkdir -p out
          for f in app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk; do
            [ -f "$f" ] || continue
            cp "$f" "out/mixinput-${GITHUB_RUN_NUMBER}.apk"
          done
          ls -la out/

      # 发布为 Release：手机上一键下载，不像 Artifacts 那样需要登录与翻找。
      # 每次构建一个新 tag（不覆盖历史产物），标记为 prerelease 以免占用 Latest。
      - name: Publish Release with APK
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 构建 ${{ github.run_number }}
          body: |
            自动构建产物

            - 提交：`${{ github.sha }}`
            - 构建号：${{ github.run_number }}
            - 下载下方 Asset 中的 APK 直接安装
          files: out/*.apk
          prerelease: true
          fail_on_unmatched_files: false
